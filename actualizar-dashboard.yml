name: Actualizar dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Madrid"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v6
      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Actualizar datos desde Shopify
        run: npm run update
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
